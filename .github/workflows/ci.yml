name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neurax
          POSTGRES_PASSWORD: neurax
          POSTGRES_DB: neurax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurax -d neurax"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://neurax:neurax@127.0.0.1:5432/neurax
      NEURAX_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: model-bge-small-en-v1.5
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests examples
      - name: Migrations and schema invariants
        run: |
          uv run neurax-migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/tests/test_invariants.sql 2>&1 | tee invariants.log  # NOTICE goes to stderr
          grep -q "ALL INVARIANT TESTS PASSED" invariants.log
      - run: uv run pytest
