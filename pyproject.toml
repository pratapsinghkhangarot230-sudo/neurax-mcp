[project]
name = "neurax-mcp"
version = "0.1.0"
description = "Decision memory for AI coding agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastembed>=0.8.1",
    "mcp>=2.3.0",
]

[project.scripts]
neurax-server = "neurax.server:main"
neurax-migrate = "neurax.migrate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neurax"  # distribution is neurax-mcp (PyPI's "neurax" is taken); import stays neurax

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import the bench package

[tool.mypy]
python_version = "3.11"
